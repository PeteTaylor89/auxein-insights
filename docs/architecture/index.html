PasswordResetConfirm","User","UserBase","UserCreate","UserInDB","UserInDBBase","UserInvitation","UserPermissions","UserProfileUpdate","UserStats","UserSummary","UserUpdate","UserWithCompany"],"path":"backend/schemas/user.py"},{"id":"schemas.vineyard_row","label":"vineyard_row","package":"schemas","type":"module","category":null,"loc":90,"docstring":"","public":["BulkRowCreationBase","BulkRowCreationRequest","BulkRowCreationResponse","ClonalSection","VineyardRow","VineyardRowBase","VineyardRowCreate","VineyardRowFilter","VineyardRowUpdate","VineyardRowWithBlock"],"path":"backend/schemas/vineyard_row.py"},{"id":"schemas.visitor","label":"visitor","package":"schemas","type":"module","category":null,"loc":224,"docstring":"","public":["BulkVisitorCreate","Visitor","VisitorBase","VisitorCreate","VisitorInDBBase","VisitorIncident","VisitorInduction","VisitorReport","VisitorSignIn","VisitorSignOut","VisitorStats","VisitorUpdate","VisitorVisit","VisitorVisitBase","VisitorVisitCreate","VisitorVisitInDBBase","VisitorVisitSummary","VisitorVisitUpdate","VisitorVisitWithDetails","VisitorWithStats"],"path":"backend/schemas/visitor.py"},{"id":"scripts","label":"scripts","package":"scripts","type":"module","category":null,"loc":0,"docstring":"","public":[],"path":"backend/scripts/__init__.py"},{"id":"scripts.aggregate_profiles","label":"aggregate_profiles","package":"scripts","type":"module","category":"db","loc":93,"docstring":"aggregate_profiles.py - Aggregate user_events into user_profiles for segmentation.\n\nUsage:\n    python -m scripts.aggregate_profiles\n\nCan also be triggered via admin endpoint POST /api/v1/admin/users/aggregate-profiles","public":["aggregate_profiles"],"path":"backend/scripts/aggregate_profiles.py"},{"id":"scripts.audit_credentials","label":"audit_credentials","package":"scripts","type":"module","category":"db","loc":229,"docstring":"scripts/audit_credentials.py\n\nHygiene audit for the ingestion credential system. Run before customer\nonboarding, after rotations, and as a CI job after credential-related\nmigrations.\n\nRuns four categories of checks:\n\n  [A] Every active `ingestion_credentials` row resolves end-to-end\n      (row \u2192 secret_arn or env_var_fallback \u2192 actual value).\n  [B] Every `devices.api_credential_ref` in use points to an existing,\n      active `ingestion_credentials` row.\n  [C] Every active `ingestion_credentials` row is referenced by at least\n      one active device (flags unused credentials).\n  [D] AWS Secrets Manager hygiene for the `auxein/ingestion/*` namespace:\n      - every secret has the required tags\n      - every secret has a matching ingestion_credentials row\n      (matched by ARN)\n\nUsage:\n    python scripts/audit_credentials.py              # all checks\n    python scripts/audit_credentials.py --no-aws     # skip category [D]\n    python scripts/audit_credentials.py --json       # machine-readable output\n\nExit code:\n    0  every check clean\n    1  issues found (WARN or FAIL)\n    2  script error (DB connection, unexpected exception)","public":["check_a_resolution","check_b_orphan_device_refs","check_c_unused_credentials","check_d_aws_hygiene","main","print_text_report","summarize"],"path":"backend/scripts/audit_credentials.py"},{"id":"scripts.backfill_grow_insights_profiles","label":"backfill_grow_insights_profiles","package":"scripts","type":"module","category":null,"loc":126,"docstring":"Backfill / migrate Insights projection rows for Grow users (Phase 2).\n\nProvisions a linked public_users row for chosen Grow users via\nensure_insights_profile (link -> adopt-by-email -> create). Idempotent: re-runs\nskip already-linked users and never duplicate an existing email.\n\nEligibility mirrors the get_insights_user gate: active, non-deleted,\nnon-contractor. Use the filters / interactive prompt to skip test accounts.\n\nPer-user action shown before migrating:\n  linked  already has a projection row (no-op)\n  adopt   matches an existing self-signup row by email -> links it; their\n          existing Insights PASSWORD IS KEPT (Grow password is never copied)\n  create  fresh password-less projection (SSO-only; can't password-login)\n\nRun after `alembic upgrade head` (grow_insights_link):\n\n    cd backend\n    # Preview everyone, no writes:\n    python scripts/backfill_grow_insights_profiles.py --dry-run\n    # Interactive \u2014 choose per user (default):\n    python scripts/backfill_grow_insights_profiles.py\n    # Migrate everyone non-interactively:\n    python scripts/backfill_grow_insights_profiles.py --all\n    # Only specific users / skip test accounts:\n    python scripts/backfill_grow_insights_profiles.py --ids 12,15,18\n    python scripts/backfill_grow_insights_profiles.py --emails a@x.co,b@y.co\n    python scripts/backfill_grow_insights_profiles.py --exclude-domain example.com","public":["csv_set","main","matches_filters","parse_args"],"path":"backend/scripts/backfill_grow_insights_profiles.py"},{"id":"scripts.backfill_incident_notifiability","label":"backfill_incident_notifiability","package":"scripts","type":"module","category":null,"loc":78,"docstring":"Re-classify WorkSafe notifiability for existing incidents.\n\nRuns the authoritative Incident.determine_notifiability() engine\n(backend/db/models/incident.py) over every incident and updates\n`is_notifiable` / `notifiable_type` where the result has changed.\n\nHistorical incidents keep their stored classification until edited, so this\nbrings older rows in line with the corrected engine (2026-05-30 audit).\n\nDeliberately leaves alone:\n  - worksafe_notified / worksafe_notification_date / worksafe_reference\n    (these are recorded facts about what a human actually did)\n  - investigation_due_date (re-basing it on now() would falsify the clock)\n\nUsage:\n    cd backend\n    python scripts/backfill_incident_notifiability.py            # dry run (default)\n    python scripts/backfill_incident_notifiability.py --apply    # commit changes","public":["main"],"path":"backend/scripts/backfill_incident_notifiability.py"},{"id":"scripts.backfill_unsubscribe_tokens","label":"backfill_unsubscribe_tokens","package":"scripts","type":"module","category":null,"loc":20,"docstring":"Backfill unsubscribe_token for existing public_users who don't have one.\nRun after the add_unsubscribe_token migration.\n\nUsage: cd backend && python scripts/backfill_unsubscribe_tokens.py","public":[],"path":"backend/scripts/backfill_unsubscribe_tokens.py"},{"id":"scripts.check_disease_data","label":"check_disease_data","package":"scripts","type":"module","category":"db","loc":156,"docstring":"CLI script to query disease_pressure table for debugging.\n\nUsage:\n    python scripts/check_disease_data.py                     # Last 30 days for all zones\n    python scripts/check_disease_data.py --zone waipara      # Specific zone\n    python scripts/check_disease_data.py --zone-id 15        # By zone ID\n    python scripts/check_disease_data.py --days 7            # Last 7 days\n    python scripts/check_disease_data.py --raw               # Show raw risk_factors JSON","public":["check_table_structure","main","query_disease_pressure"],"path":"backend/scripts/check_disease_data.py"},{"id":"scripts.check_schema","label":"check_schema","package":"scripts","type":"module","category":"db","loc":41,"docstring":"","public":["run_check"],"path":"backend/scripts/check_schema.py"},{"id":"scripts.cleanup_blacklist","label":"cleanup_blacklist","package":"scripts","type":"module","category":"fs","loc":27,"docstring":"scripts/cleanup_blacklist.py\n\nRemove expired entries from the token blacklist table.\nRun daily via the daily processing pipeline.","public":["main"],"path":"backend/scripts/cleanup_blacklist.py"},{"id":"scripts.compute_completed_season","label":"compute_completed_season","package":"scripts","type":"module","category":"fs","loc":51,"docstring":"scripts/compute_completed_season.py\n\nFold a completed growing season's extreme metrics (frost / hot days / R99p /\nlast frost) from the live zone-daily series into climate_zone_season_stats as\n'observed' rows. Run after a season ends (\u2265 30 Apr). Idempotent; never clobbers\nmodelled rows.\n\nUsage:\n    # one zone\n    python scripts/compute_completed_season.py --vintage 2026 --zone waipara\n    # all active zones\n    python scripts/compute_completed_season.py --vintage 2026\n    # ignore the completeness gate (e.g. mid-season preview)\n    python scripts/compute_completed_season.py --vintage 2026 --force","public":["main"],"path":"backend/scripts/compute_completed_season.py"},{"id":"scripts.daily_aggregation","label":"daily_aggregation","package":"scripts","type":"module","category":"db","loc":249,"docstring":"scripts/daily_aggregation.py\n\nAggregate raw weather_data into weather_data_daily table.\nCalculates daily min/max/mean for temperature and humidity,\nsum for rainfall and solar radiation, and GDD values.\n\nDesigned to run daily via GitHub Actions at 6pm NZT (15-hour delay for data sources).\n\nUsage:\n    python scripts/daily_aggregation.py                          # Process yesterday\n    python scripts/daily_aggregation.py --date 2025-10-15        # Process specific date\n    python scripts/daily_aggregation.py --start 2025-10-01 --end 2025-10-31  # Date range\n    python scripts/daily_aggregation.py --dry-run                # Show what would be processed","public":["aggregate_station_day","get_active_stations","main","process_date","run_daily_aggregation","upsert_daily_record"],"path":"backend/scripts/daily_aggregation.py"},{"id":"scripts.data_import","label":"data_import","package":"scripts.data_import","type":"module","category":null,"loc":0,"docstring":"","public":[],"path":"backend/scripts/data_import/__init__.py"},{"id":"scripts.data_import.csv_analyser","label":"csv_analyser","package":"scripts.data_import","type":"module","category":"fs","loc":160,"docstring":"","public":["CSVAnalyzer"],"path":"backend/scripts/data_import/csv_analyser.py"},{"id":"scripts.data_import.import_climate_csvs","label":"import_climate_csvs","package":"scripts.data_import","type":"module","category":"db","loc":346,"docstring":"Standalone Climate Data Import Script\nRun from the backend directory: python scripts/data_import/climate_import.py","public":["get_available_csvs","get_block_info","import_csv_file","main"],"path":"backend/scripts/data_import/import_climate_csvs.py"},{"id":"scripts.data_import.import_climate_csvs_optimized","label":"import_climate_csvs_optimized","package":"scripts.data_import","type":"module","category":"db","loc":609,"docstring":"Optimized Bulk Climate Data Import Script\nHandles 8,744+ CSV files with >10GB of data efficiently\n\nKey optimizations:\n- PostgreSQL COPY for bulk inserts (100-1000x faster)\n- Parallel processing across multiple files\n- Removes per-row duplicate checking\n- Batch operations with large chunks\n- Progress tracking and resume capability\n\nRun from backend directory: python scripts/data_import/import_climate_csvs_optimized.py","public":["BulkClimateImporter","get_available_csvs","main"],"path":"backend/scripts/data_import/import_climate_csvs_optimized.py"},{"id":"scripts.data_import.import_climate_standalone","label":"import_climate_standalone","package":"scripts.data_import","type":"module","category":"db","loc":503,"docstring":"Standalone Climate Data Import Script for EC2\nOptimized for AWS RDS import with PostgreSQL COPY\n\nUsage:\n  export DATABASE_URL=\"postgresql://user:pass@host:5432/db?sslmode=require\"\n  python3 import_climate_standalone.py --csv-dir ~/climate_data --workers 8","public":["BulkClimateImporter","get_available_csvs","main"],"path":"backend/scripts/data_import/import_climate_standalone.py"},{"id":"scripts.data_import.preserve_id_importer","label":"preserve_id_importer","package":"scripts.data_import","type":"module","category":"db","loc":261,"docstring":"","public":["PreserveIDShapefileImporter"],"path":"backend/scripts/data_import/preserve_id_importer.py"},{"id":"scripts.data_import.setup_database","label":"setup_database","package":"scripts.data_import","type":"module","category":"db","loc":97,"docstring":"","public":["DatabaseSetup"],"path":"backend/scripts/data_import/setup_database.py"},{"id":"scripts.data_import.shapefile_importer","label":"shapefile_importer","package":"scripts.data_import","type":"module","category":"db","loc":239,"docstring":"","public":["BasicShapefileImporter"],"path":"backend/scripts/data_import/shapefile_importer.py"},{"id":"scripts.data_import.validate_before_import","label":"validate_before_import","package":"scripts.data_import","type":"module","category":"db","loc":284,"docstring":"Pre-flight validation script for climate data import\nChecks database connectivity, block existence, and estimates import time\n\nUsage:\n  python validate_before_import.py --csv-dir /path/to/csvs","public":["check_blocks_in_database","check_existing_data","check_table_structure","estimate_import_time","get_connection","main","scan_csv_files","test_database_connection"],"path":"backend/scripts/data_import/validate_before_import.py"},{"id":"scripts.disease_service_v2","label":"disease_service_v2","package":"scripts","type":"module","category":"db","loc":575,"docstring":"scripts/disease_service_v2.py\n\nEnhanced disease pressure calculation using peer-reviewed models.\nUses hourly climate data from climate_zone_hourly table.\n\nModels:\n1. Powdery Mildew: UC Davis Risk Index (Gubler et al., 1999)\n2. Botrytis: Gonz\u00e1lez-Dom\u00ednguez Model (2015)  \n3. Downy Mildew: 3-10 Rule + Goidanich Index\n\nNOTE: This service requires:\n- climate_zone_hourly table (from add_hourly_climate migration)\n- Updated disease_pressure columns (pm_*, botrytis_*, dm_*)\n\nUsage:\n    python scripts/disease_service_v2.py                              # Process yesterday\n    python scripts/disease_service_v2.py --date 2025-01-20            # Specific date\n    python scripts/disease_service_v2.py --start 2025-10-01           # Oct 1 to yesterday\n    python scripts/disease_service_v2.py --start 2025-10-01 --end 2025-12-31  # Date range\n    python scripts/disease_service_v2.py --backfill 30                # Last 30 days\n    python scripts/disease_service_v2.py --dry-run                    # Test without saving","public":["BotrytisModel","BotrytisResult","DownyMildewModel","DownyMildewResult","PMResult","UCDavisPMIndex","calculate_dewpoint","estimate_wetness","get_48h_conditions","get_growth_stage","get_hourly_data","get_previous_state","get_vintage_year","main","run_disease_service"],"path":"backend/scripts/disease_service_v2.py"},{"id":"scripts.generate_blocks_image","label":"generate_blocks_image","package":"scripts","type":"module","category":"db","loc":293,"docstring":"scripts/generate_blocks_image.py\n\nGenerate static PNG image overlay of all NZ vineyard blocks.\nThis image is served to users instead of raw GeoJSON to prevent geometry scraping.\n\nUsage:\n    python scripts/generate_blocks_image.py --output blocks-overlay.png\n    python scripts/generate_blocks_image.py --varieties  # Generate per-variety images\n\nRequirements:\n    pip install mapbox pillow requests geopandas matplotlib","public":["generate_image_matplotlib","generate_metadata","generate_variety_images","get_blocks_geojson","main"],"path":"backend/scripts/generate_blocks_image.py"},{"id":"scripts.harvest_csv_backfill","label":"harvest_csv_backfill","package":"scripts","type":"module","category":"db","loc":303,"docstring":"scripts/harvest_csv_backfill.py\n\nImport historical weather data from Harvest Electronics CSV exports\ninto the weather_data table.\n\nCSV Format Expected:\n- First column: \"Time (dd/mm/yyyy hh:mm:ss) Pacific/Auckland\"\n- Remaining columns: Station codes with variable suffix\n  - _TEMP \u2192 'temp' variable\n  - _HUMIDITY \u2192 'humidity' variable  \n  - _PRECIP \u2192 'rainfall' variable\n  - _RADIATION \u2192 'solar_radiation' variable\n\nUsage:\n    python scripts/harvest_csv_backfill.py --file /path/to/Barbour.csv\n    python scripts/harvest_csv_backfill.py --dir /path/to/csv/folder\n    python scripts/harvest_csv_backfill.py --file /path/to/data.csv --dry-run","public":["extract_station_and_variable","get_station_lookup","insert_batch","main","parse_timestamp","parse_value","process_csv_file","upload_harvest_csv"],"path":"backend/scripts/harvest_csv_backfill.py"},{"id":"scripts.hourly_aggregation","label":"hourly_aggregation","package":"scripts","type":"module","category":"db","loc":662,"docstring":"scripts/hourly_aggregation.py\n\nAggregate weather station data to hourly zone-level climate.\nIncludes leaf wetness estimation and dew point calculation.\n\nSCHEMA NOTES:\n- Zone assignment is via `zone_id` column on `weather_stations` table\n- Raw data from `weather_data` table (EAV schema)\n- EAV columns: station_id, timestamp, variable, value, unit, quality\n- Variables pivoted: temperature, humidity, rainfall\n\nUsage:\n    python scripts/hourly_aggregation.py                    # Process last 24 hours\n    python scripts/hourly_aggregation.py --date 2025-01-20  # Specific date\n    python scripts/hourly_aggregation.py --hours 48         # Last N hours\n    python scripts/hourly_aggregation.py --dry-run          # Show without saving\n    python scripts/hourly_aggregation.py --check-vars       # List available variables\n    python scripts/hourly_aggregation.py --check-stations   # Check station variables (all)\n    python scripts/hourly_aggregation.py --check-stations 15  # Check station variables (zone 15)\n    \n    # Date range backfill:\n    python scripts/hourly_aggregation.py --start-date 2025-10-01                    # Oct 1 to today\n    python scripts/hourly_aggregation.py --start-date 2025-10-01 --end-date 2025-12-31  # Oct-Dec 2025\n    python scripts/hourly_aggregation.py --start-date 2025-10-01 --dry-run          # Dry run backfill","public":["aggregate_to_zone","calculate_dew_point","check_available_variables","check_station_variables","determine_confidence","estimate_leaf_wetness","get_hourly_station_data","get_vintage_year","get_zone_station_mappings","main","process_time_range","run_hourly_aggregation","run_hourly_aggregation_range","track_hours_since_rain"],"path":"backend/scripts/hourly_aggregation.py"},{"id":"scripts.import_el_stage_images","label":"import_el_stage_images","package":"scripts","type":"module","category":"db","loc":143,"docstring":"Core-based importer to avoid ORM registry issues.\n- Scans --src-dir for el_*.jpg|jpeg|png|webp\n- Copies to UPLOAD_DIR/<company_id>/reference_item/YYYY/MM/<uuid>.<ext>\n- INSERTs into files and reference_item_files (primary image)\n\nUsage:\n  python -m scripts.import_el_stage_images_core     --src-dir \"A:/images/el scale\"     --company-id 7     --uploaded-by 11\n  # add --dry-run to preview","public":["detect_mime","ensure_dir","main","parse_el_key","upload_subdir"],"path":"backend/scripts/import_el_stage_images.py"},{"id":"scripts.load_climate_zone_geometry","label":"load_climate_zone_geometry","package":"scripts","type":"module","category":"db","loc":103,"docstring":"scripts/load_climate_zone_geometry.py\n\nLoad shapefile geometry into the climate_zones table.\n\nExpects one .shp file per zone in backend/data/Climate_Zones/,\nnamed to match the zone's `name` column (e.g., Bendigo.shp \u2192 \"Bendigo\").\n\nIf a shapefile contains multiple features they are unioned into a single\nMULTIPOLYGON. All input is reprojected to EPSG:4326 if needed.\n\nUsage:\n    python scripts/load_climate_zone_geometry.py\n    python scripts/load_climate_zone_geometry.py --dry-run\n    python scripts/load_climate_zone_geometry.py --zone Bendigo","public":["load_shapefile","main"],"path":"backend/scripts/load_climate_zone_geometry.py"},{"id":"scripts.phenology_service","label":"phenology_service","package":"scripts","type":"module","category":"db","loc":305,"docstring":"scripts/phenology_service.py\n\nCalculate phenological stage estimates for each variety in each zone\nbased on accumulated GDD (base 0).\n\nUsage:\n    python scripts/phenology_service.py                    # Process today\n    python scripts/phenology_service.py --date 2025-12-15  # Specific date\n    python scripts/phenology_service.py --dry-run          # Show without saving","public":["determine_stage","estimate_date","get_average_daily_gdd","get_baseline_gdd","get_day_of_vintage","get_gdd_offset_at_day","get_phenology_thresholds","get_previous_estimate","get_vintage_year","get_zones_with_climate_data","main","run_phenology_service"],"path":"backend/scripts/phenology_service.py"},{"id":"scripts.probe_credential_resolver","label":"probe_credential_resolver","package":"scripts","type":"module","category":"db","loc":113,"docstring":"scripts/probe_credential_resolver.py\n\nResolve a credential ref against the live DB + AWS / env, print outcome\nwithout revealing the secret value. Used to validate the resolver path\nend-to-end before relying on it in ingestion.\n\nUsage:\n    python scripts/probe_credential_resolver.py harvest/default\n    python scripts/probe_credential_resolver.py harvest/black-estate\n    python scripts/probe_credential_resolver.py --all-active\n\nOutput (success):\n    OK   harvest/default               source=env_var (HARVEST_API_KEY)        len=32\n    OK   harvest/maori-point           source=secrets_manager                  len=32\n\nOutput (failure):\n    FAIL harvest/missing               CredentialNotFound: No ingestion_credentials row for ...\n\nExit code: 0 if all probed refs resolved, 1 otherwise.","public":["list_active_refs","main","probe"],"path":"backend/scripts/probe_credential_resolver.py"},{"id":"scripts.run_daily_processing","label":"run_daily_processing","package":"scripts","type":"module","category":"fs","loc":182,"docstring":"scripts/run_daily_processing.py\n\nRun the complete daily processing pipeline:\n1. Daily aggregation (weather_data \u2192 weather_data_daily)\n2. Hourly aggregation (weather_data \u2192 climate_zone_hourly)\n3. Zone aggregation (weather_data_daily \u2192 climate_zone_daily)\n4. Phenology estimation\n5. Disease pressure calculation (v2 - uses hourly data)\n\nDesigned to run daily at 6pm NZ time after all data sources have reported.\n\nUsage:\n    python scripts/run_daily_processing.py                    # Process yesterday\n    python scripts/run_daily_processing.py --date 2025-12-15  # Specific date\n    python scripts/run_daily_processing.py --dry-run          # Test run","public":["main","run_script"],"path":"backend/scripts/run_daily_processing.py"},{"id":"scripts.seed_climate_zones","label":"seed_climate_zones","package":"scripts","type":"module","category":"db","loc":261,"docstring":"scripts/seed_climate_zones.py\n\nSeed the 20 climate zones with FK links to wine_regions.\n\nUsage:\n    python scripts/seed_climate_zones.py\n    python scripts/seed_climate_zones.py --dry-run\n    python scripts/seed_climate_zones.py --update  # Update existing zones","public":["main","seed_climate_zones"],"path":"backend/scripts/seed_climate_zones.py"},{"id":"scripts.seed_el_simple","label":"seed_el_simple","package":"scripts","type":"module","category":"db","loc":96,"docstring":"Seed EL stages (and phases) into reference_items using raw SQL (no ORM imports).\n\nUsage:\n  # uses DATABASE_URL or SQLALCHEMY_DATABASE_URL if set\n  python -m scripts.seed_el_simple\n\n  # or pass a URL explicitly\n  python -m scripts.seed_el_simple --url postgresql+psycopg2://user:pass@host:5432/dbname\n\n  # seed org overrides instead of global\n  python -m scripts.seed_el_simple --company-id 9","public":["main","seed_category"],"path":"backend/scripts/seed_el_simple.py"},{"id":"scripts.seed_email_templates","label":"seed_email_templates","package":"scripts","type":"module","category":"fs","loc":58,"docstring":"scripts/seed_email_templates.py\n\nSeed the email_templates table with the 3 campaign template types:\n  - Article Spotlight (single article feature)\n  - Weekly Roundup (auto-composed roundup article, sent spotlight-style)\n  - Climate Data Alert (data-triggered notification)\n\nUsage:\n    python scripts/seed_email_templates.py","public":["seed"],"path":"backend/scripts/seed_email_templates.py"},{"id":"scripts.seed_gis","label":"seed_gis","package":"scripts","type":"module","category":"db","loc":338,"docstring":"scripts/seed_gis.py\n\nSeed Geographical Indications (GIs) from ESRI JSON files.\n\nThis script:\n1. Reads ESRI JSON files from a specified directory\n2. Converts ESRI geometry to PostGIS-compatible format\n3. Extracts metadata (IP number, IPoNZ URL, etc.)\n4. Links GIs to parent wine regions via spatial containment\n5. Inserts into the database\n\nUsage:\n    python scripts/seed_gis.py --input-dir ./data/gis\n    python scripts/seed_gis.py --input-dir ./data/gis --dry-run\n    python scripts/seed_gis.py --input-file ./data/gis/kumeu.json\n\nExpected ESRI JSON format:\n{\n    \"features\": [\n        {\n            \"attributes\": {\n                \"IP_Number\": \"1018\",\n                \"GI_Name\": \"Auckland\",\n                \"Registerlink\": \"https://...\",\n                \"End_Date\": null,\n                \"Notes\": null\n            },\n            \"geometry\": {\n                \"rings\": [[[lng, lat], ...]]\n            }\n        }\n    ],\n    \"spatialReference\": {\"wkid\": 4167}  // NZGD2000\n}","public":["calculate_bounds","ensure_multipolygon","esri_rings_to_geojson","find_parent_region","generate_slug","main","parse_esri_json","seed_gis","seed_gis_from_file","transform_nzgd2000_to_wgs84"],"path":"backend/scripts/seed_gis.py"},{"id":"scripts.seed_pest_disease_catalogs","label":"seed_pest_disease_catalogs","package":"scripts","type":"module","category":"db","loc":168,"docstring":"Seed system (company_id=NULL) reference catalogs:\n- category='disease'\n- category='pest'\n\nAdds the exact vineyard/biosecurity items requested. Optionally prunes extras.\n\nUsage:\n  python -m scripts.seed_pest_disease_catalogs\n  python -m scripts.seed_pest_disease_catalogs --prune-extras","public":["main","prune_extras","seed_category"],"path":"backend/scripts/seed_pest_disease_catalogs.py"},{"id":"scripts.seed_reference_el_stages","label":"seed_reference_el_stages","package":"scripts","type":"module","category":"db","loc":128,"docstring":"Seed EL stages (and phases) into reference_items.\n\nUsage:\n  # seed global/system items\n  python scripts/seed_reference_el_stages.py\n\n  # OR seed org-specific overrides\n  python scripts/seed_reference_el_stages.py --company-id 9","public":["main","upsert_el_phases","upsert_el_stages"],"path":"backend/scripts/seed_reference_el_stages.py"},{"id":"scripts.seed_regions","label":"seed_regions","package":"scripts","type":"module","category":"db","loc":517,"docstring":"scripts/seed_regions.py\n\nSeed wine regions with:\n1. Boundaries from Stats NZ Datafinder\n2. Stats from NZWine 2024 data (complete variety breakdown)\n3. Descriptions (drafted)\n\nUsage:\n    python scripts/seed_regions.py\n    python scripts/seed_regions.py --dry-run  # Preview without inserting\n    python scripts/seed_regions.py --update   # Update existing regions","public":["build_varieties_list","calculate_bounds","fetch_linz_boundary","main","merge_geometries","seed_regions"],"path":"backend/scripts/seed_regions.py"},{"id":"scripts.seed_system_templates","label":"seed_system_templates","package":"scripts","type":"module","category":"db","loc":295,"docstring":"Seed system (company_id=NULL) observation templates with field schemas that match\nthe vineyard operations list.\n\nUsage:\n  python -m scripts.seed_system_templates","public":["main","scope_fields","upsert_template"],"path":"backend/scripts/seed_system_templates.py"},{"id":"scripts.synthesize_overview_climate","label":"synthesize_overview_climate","package":"scripts","type":"module","category":"db","loc":272,"docstring":"scripts/synthesize_overview_climate.py\n\nSynthesize climate_history_monthly, climate_projections,\nclimate_baseline_monthly, and climate_zone_daily_baseline rows for parent\n(region-level) climate_zones by averaging their direct sub-zones' data.\n\nWhy this exists\n---------------\nThe BCSD climate model was run per-zone. For some regions both the whole-\nregion zone and its sub-zones were simulated separately (e.g. Central Otago,\nHawke's Bay). For Marlborough and Wairarapa only the sub-zones were run, so\nthe recently-added overview climate_zones rows have no history / projections\n/ baseline.\n\nThe modelling approach permits aggregation, so we synthesize overview rows\nas the simple mean of their direct sub-zones' data. Regional Insights\nrenders uniformly across all zones; users comparing Marlborough to Central\nOtago see history/projections for both.\n\nTargets\n-------\nBy default: every `zone_level='region'` climate_zone that has zero rows in\n`climate_history_monthly` and has at least one direct sub-zone with data.\nCurrently that's Marlborough and Wairarapa. Pass `--zone-id N` to target a\nspecific zone.\n\nUsage\n-----\n    python scripts/synthesize_overview_climate.py                    # Dry run\n    python scripts/synthesize_overview_climate.py --apply            # Commit\n    python scripts/synthesize_overview_climate.py --zone-id 22 --apply\n    python scripts/synthesize_overview_climate.py --replace --apply  # Overwrite existing\n\nSafety\n------\n  - Idempotent by default (`ON CONFLICT DO NOTHING` on the natural keys).\n  - `--replace` uses `ON CONFLICT DO UPDATE` if you want to re-derive after\n    sub-zone data changes.\n  - All-or-nothing per target zone: runs in a single transaction, rolls back\n    on any error.\n  - Prints counts in dry-run mode; commits only with `--apply`.","public":["count_source_subzones","find_target_zones","main","preview_row_counts","synthesize_for_zone"],"path":"backend/scripts/synthesize_overview_climate.py"},{"id":"scripts.test_db_config","label":"test_db_config","package":"scripts","type":"module","category":"db","loc":66,"docstring":"","public":["test_connection"],"path":"backend/scripts/test_db_config.py"},{"id":"scripts.upload_baseline","label":"upload_baseline","package":"scripts","type":"module","category":"db","loc":255,"docstring":"scripts/upload_baseline.py\n\nUpload 1986-2005 daily climatology data into climate_zone_daily_baseline table.\n\nCSV Format Expected (one file per zone, named {ZoneName}_daily_climatology_1986_2005.csv):\n    date,doy_vintage,mean_Tmean,sd_Tmean,mean_Tmin,sd_Tmin,mean_Tmax,sd_Tmax,\n    mean_GDD10,sd_GDD10,mean_GDD0,sd_GDD0,mean_Rain,sd_Rain,mean_Solar,sd_Solar\n\nUsage:\n    python scripts/upload_baseline.py --file /path/to/Auckland_daily_climatology_1986_2005.csv --zone-name Auckland\n    python scripts/upload_baseline.py --dir /path/to/baseline_csvs/\n    python scripts/upload_baseline.py --file /path/to/data.csv --zone-name Auckland --dry-run\n    python scripts/upload_baseline.py --file /path/to/data.csv --zone-name Auckland --clear","public":["extract_zone_name_from_filename","get_zone_lookup","load_baseline_csv","main","parse_decimal","upload_baseline_climatology","upload_baseline_file"],"path":"backend/scripts/upload_baseline.py"},{"id":"scripts.upload_climate_extremes","label":"upload_climate_extremes","package":"scripts","type":"module","category":"fs","loc":352,"docstring":"scripts/upload_climate_extremes.py\n\nLoad the seasonal extreme datasets in backend/data/Regional_additional_stats/\ninto the climate extreme tables. Zone is resolved by CSV filename stem\n(e.g. \"Waipara.csv\" -> ClimateZone.name == \"Waipara\"), matching\nupload_climate_history.py.\n\nDatasets (sub-directories of --root):\n  Regional_Seasonal_Stats         -> climate_zone_season_stats (source='modelled')\n  Regional_Seasonal_Baseline      -> climate_zone_season_baseline\n  Regional_Seasonal_Rx1day        -> climate_history_monthly.rx1day_* (UPDATE)\n  Regional_Seasonal_Rx1day_Baseline -> climate_baseline_monthly.rx1day_* (UPDATE)\n  Regional_Projections_Extremes   -> climate_projection_extremes\n\nReloading is idempotent: modelled season-stats / baseline / projection rows for\na zone are cleared before reinsert (observed season-stats rows are preserved).\n\nUsage:\n    python scripts/upload_climate_extremes.py --root backend/data/Regional_additional_stats\n    python scripts/upload_climate_extremes.py --root <dir> --dataset stats --dry-run","public":["dec","iter_frost_files","iter_zone_files","load_frost","load_frost_baseline","load_projection_extremes","load_rx1day","load_rx1day_baseline","load_season_baseline","load_stats","main","resolve_zone","to_int"],"path":"backend/scripts/upload_climate_extremes.py"},{"id":"scripts.upload_climate_history","label":"upload_climate_history","package":"scripts","type":"module","category":"db","loc":193,"docstring":"scripts/upload_climate_history.py\n\nUpload monthly climate history from CSV files to climate_history_monthly table.\n\nCSV filename must match zone name exactly (e.g., \"Auckland.csv\" for zone \"Auckland\").\n\nUsage:\n    # Upload single zone\n    python scripts/upload_climate_history.py --file /path/to/Auckland.csv\n    \n    # Upload all CSVs in directory\n    python scripts/upload_climate_history.py --dir /path/to/history_csvs/\n    \n    # Dry run (preview without inserting)\n    python scripts/upload_climate_history.py --dir /path/to/csvs/ --dry-run\n    \n    # Clear existing data for zone before upload\n    python scripts/upload_climate_history.py --file Auckland.csv --clear","public":["get_zone_name_from_filename","main","parse_decimal","upload_climate_history","upload_history_file"],"path":"backend/scripts/upload_climate_history.py"},{"id":"scripts.upload_climate_projections","label":"upload_climate_projections","package":"scripts","type":"module","category":"db","loc":243,"docstring":"scripts/upload_climate_projections.py\n\nUpload climate projections from CSV files to:\n- climate_baseline_monthly (extracted from Baseline_* columns)\n- climate_projections (SSP scenarios)\n\nCSV filename must match zone name (e.g., \"Auckland_projections.csv\" for zone \"Auckland\").\n\nUsage:\n    # Upload single zone\n    python scripts/upload_climate_projections.py --file /path/to/Auckland_projections.csv\n    \n    # Upload all projection CSVs in directory\n    python scripts/upload_climate_projections.py --dir /path/to/projection_csvs/\n    \n    # Dry run\n    python scripts/upload_climate_projections.py --dir /path/to/csvs/ --dry-run\n    \n    # Clear existing data before upload\n    python scripts/upload_climate_projections.py --file Auckland_projections.csv --clear","public":["get_zone_name_from_filename","main","parse_decimal","upload_climate_projections","upload_projections_file"],"path":"backend/scripts/upload_climate_projections.py"},{"id":"scripts.upload_phenology","label":"upload_phenology","package":"scripts","type":"module","category":"db","loc":175,"docstring":"scripts/upload_phenology.py\n\nUpload phenology GDD thresholds from CSV into the phenology_thresholds table.\n\nCSV Format Expected:\n    Variety,Flowering,Veraison,_170g/L,_180g/L,_190g/L,_200g/L,_210g/L,_220g/L\n    Pinot noir,1219,2507,2695,2734,2788,2838,2899,2933\n\nNote: All GDD values are base 0.\n\nUsage:\n    python scripts/upload_phenology.py --file /path/to/Phenology.csv\n    python scripts/upload_phenology.py --file /path/to/Phenology.csv --dry-run\n    python scripts/upload_phenology.py --file /path/to/Phenology.csv --clear","public":["load_phenology_csv","main","parse_decimal","upload_phenology_thresholds"],"path":"backend/scripts/upload_phenology.py"},{"id":"scripts.zone_aggregation","label":"zone_aggregation","package":"scripts","type":"module","category":"db","loc":283,"docstring":"scripts/zone_aggregation.py\n\nAggregate station-level daily data (weather_data_daily) into zone-level \naggregates (climate_zone_daily) using Inverse Distance Weighting (IDW).\n\nUsage:\n    python scripts/zone_aggregation.py                           # Process yesterday\n    python scripts/zone_aggregation.py --date 2025-10-15         # Process specific date\n    python scripts/zone_aggregation.py --start 2025-10-01 --end 2025-10-31  # Date range\n    python scripts/zone_aggregation.py --dry-run                 # Show what would be processed","public":["aggregate_zone_day","get_previous_cumulative_gdd","get_vintage_year","get_zone_stations_with_data","get_zones_with_stations","main","mean_with_outlier_removal","run_zone_aggregation","upsert_zone_daily"],"path":"backend/scripts/zone_aggregation.py"},{"id":"services","label":"services","package":"services","type":"module","category":null,"loc":0,"docstring":"","public":[],"path":"backend/services/__init__.py"},{"id":"services.block_service","label":"block_service","package":"services","type":"module","category":"db","loc":85,"docstring":"Block Service with Blockchain Integration\nHandles vineyard block assignments and auto-creates blockchain chains","public":["BlockService"],"path":"backend/services/block_service.py"},{"id":"services.blockchain_service","label":"blockchain_service","package":"services","type":"module","category":"db","loc":392,"docstring":"Flexible Season Management for Viticultural Edge Cases\nHandles dessert wines, late harvest, multiple harvest scenarios","public":["BlockchainService","FlexibleSeasonManager"],"path":"backend/services/blockchain_service.py"},{"id":"services.climate_calculations","label":"climate_calculations","package":"services","type":"module","category":"db","loc":245,"docstring":"","public":["ClimateCalculations"],"path":"backend/services/climate_calculations.py"},{"id":"services.credential_service","label":"credential_service","package":"services","type":"module","category":"db","loc":125,"docstring":"Credential resolver for ingestion sources.\n\nPhase B1 of DATA_INGESTION_PLATFORM_PLAN.md.\n\nResolves a credential ref string ('harvest/default', 'harvest/black-estate')\ninto the actual secret value (typically an API key). Devices reference a\ncredential via `devices.api_credential_ref`; the matching `ingestion_credentials`\nrow points to either an AWS Secrets Manager ARN or an env var fallback.\n\nLookup order per ref:\n  1. `ingestion_credentials` row matching (provider, name) \u2014 case-insensitive on provider\n  2. If `secret_arn` is set \u2192 fetch from AWS Secrets Manager (cached per process)\n  3. Else if `env_var_fallback` is set \u2192 read os.environ\n  4. Else raise CredentialNotFound\n\nCaches resolved values in-process so a single ingestion run only fetches each\nsecret once even when many devices share the same credential. Secret values\nare never logged.","public":["CredentialError","CredentialFetchFailed","CredentialNotFound","CredentialResolver"],"path":"backend/services/credential_service.py"},{"id":"services.email_service","label":"email_service","package":"services","type":"module","category":"config","loc":639,"docstring":"","public":["UnifiedEmailService"],"path":"backend/services/email_service.py"},{"id":"services.file_storage","label":"file_storage","package":"services","type":"module","category":"cloud","loc":118,"docstring":"S3-backed file storage for user uploads.\n\nWraps boto3 so `files.py` can stay agnostic to the storage backend.\nPattern mirrors `backend/api/v1/article_images.py::_get_s3_client`.\n\nLocal-dev fallback: when `settings.UPLOADS_S3_BUCKET` is unset, the storage\nbackend is considered disabled. Callers should handle this by writing to\nlocal disk (`UPLOAD_DIR`) instead \u2014 that path is preserved in `files.py`\nfor legacy reads and dev parity.\n\nSecurity note: the bucket is private. The EB instance role\n(`aws-elasticbeanstalk-ec2-role`) carries the `AuxeinUploadsRW` policy that\ngrants PutObject/GetObject/DeleteObject/ListBucket on the bucket only.\nClients never receive credentials or direct S3 URLs \u2014 downloads are streamed\nthrough the backend so per-request auth checks stay in one place.","public":["FileStorageNotConfigured","delete_object","generate_presigned_url","head_object","is_enabled","make_s3_key","stream_object","upload_fileobj"],"path":"backend/services/file_storage.py"},{"id":"services.forecast_service","label":"forecast_service","package":"services","type":"module","category":"http","loc":229,"docstring":"services/forecast_service.py \u2014 MetOcean forecast proxy + cache + normalisation.\n\nReplaces the previous client-side MetOcean call (which leaked the API key in\nthe web bundle). Both web and mobile now hit /api/v1/forecast/* and get the\nsame normalised shape from this module.\n\nCaching:\n  In-process TTL cache keyed by (lat, lon, hours, interval_h) rounded to\n  3 decimal places. Single-instance EB box is fine; a small Redis layer can\n  replace this if/when we go multi-instance, with no API change.\n\nMetOcean reference (v2):\n  POST/GET /point/time \u2014 params: lat, lon, variables (comma-sep), from, to OR\n  from + interval + repeat. Response: { dimensions: { time, point }, variables:\n  { '<name>': { data: [], units: '...' } } }.","public":["ForecastError","ForecastSlice","get_conditions","get_current_only"],"path":"backend/services/forecast_service.py"},{"id":"services.gps_processing","label":"gps_processing","package":"services","type":"module","category":"db","loc":177,"docstring":"","public":["process_gps_track"],"path":"backend/services/gps_processing.py"},{"id":"services.insights_profile","label":"insights_profile","package":"services","type":"module","category":"db","loc":93,"docstring":"Grow -> Insights provisioning (Phase 2).\n\nResolves a Grow `users` identity to its single Insights `public_users` row,\ncreating a password-less PROJECTION row on first crossing. This is what lets all\ndownstream Insights code (mailing lists, admin stats, last_active heartbeat) stay\nsingle-table while authenticating from the Grow token.\n\nProvisioning rule (handles users who already exist in both products):\n  1. link  \u2014 an existing row already points at this grow_user_id  -> return it\n  2. adopt \u2014 an existing row matches by email (a prior self-signup)  -> link it\n             (set grow_user_id; keep their password + origin='signup' so they can\n             still password-login as a real subscriber); verify it (Grow identity\n             is trusted for the same email)\n  3. create \u2014 no row yet -> a fresh projection (origin='grow', hashed_password\n             NULL, is_verified True, opt-ins FALSE pending explicit consent)\n\nThe caller owns the transaction; this flushes (to assign an id for downstream\nFKs like likes/comments) but does NOT commit.","public":["ensure_insights_profile","preview_insights_action"],"path":"backend/services/insights_profile.py"},{"id":"services.integrated_risk_service","label":"integrated_risk_service","package":"services","type":"module","category":"db","loc":525,"docstring":"","public":["IntegratedRiskService"],"path":"backend/services/integrated_risk_service.py"},{"id":"services.linz_parcels_service","label":"linz_parcels_service","package":"services","type":"module","category":"http","loc":382,"docstring":"","public":["LINZParcelsService"],"path":"backend/services/linz_parcels_service.py"},{"id":"services.management_service","label":"management_service","package":"services","type":"module","category":"db","loc":135,"docstring":"","public":["transfer_management"],"path":"backend/services/management_service.py"},{"id":"services.notification_service","label":"notification_service","package":"services","type":"module","category":"db","loc":276,"docstring":"","public":["NotificationService"],"path":"backend/services/notification_service.py"},{"id":"services.parcel_sync_service","label":"parcel_sync_service","package":"services","type":"module","category":"db","loc":264,"docstring":"","public":["ParcelSyncService"],"path":"backend/services/parcel_sync_service.py"},{"id":"services.property_service","label":"property_service","package":"services","type":"module","category":"db","loc":72,"docstring":"","public":["get_visible_property_ids","verify_block_access"],"path":"backend/services/property_service.py"},{"id":"services.risk_action_service","label":"risk_action_service","package":"services","type":"module","category":"db","loc":357,"docstring":"","public":["RiskActionService"],"path":"backend/services/risk_action_service.py"},{"id":"services.risk_logic","label":"risk_logic","package":"services","type":"module","category":"db","loc":231,"docstring":"","public":["RiskBusinessLogic"],"path":"backend/services/risk_logic.py"},{"id":"services.run_completion","label":"run_completion","package":"services","type":"module","category":"db","loc":735,"docstring":"","public":["complete_run"],"path":"backend/services/run_completion.py"},{"id":"services.season_extremes","label":"season_extremes","package":"services","type":"module","category":"db","loc":130,"docstring":"Compute seasonal extreme metrics for a completed growing season from the live\nzone-daily series, and fold them into climate_zone_season_stats as 'observed'\nrows \u2014 so the history self-extends each year without new modelled CSVs.\n\nDefinitions match the modelled dataset (verified from the CSVs 2026-06-12):\n- FD (frost_days)   = days Tmin < 0\u00b0C over the FULL vintage year (Jul-Jun) \u2014\n                      most frosts are winter, so this is an annual count\n- spring frost      = FD in Sep-Nov (SON)\n- last frost        = last spring frost (Sep-Dec window), DOY + 'DD-Mon'\n- TX30 (hot_days30) = days Tmax > 30\u00b0C (vintage year; summer only in practice)\n- R99p              = 99th-percentile of wet-day (>=1mm) daily rainfall (mm)\n\nCaveats:\n- climate_zone_daily is a single IDW-aggregated series, so observed rows have no\n  spatial SD (mean only); modelled rows keep their SD.\n- Annual FD needs full Jul-Jun coverage incl. winter. The station series is young\n  (Waipara starts Sep 2025), so upsert is gated on full vintage coverage and will\n  legitimately skip until a complete vintage year of data exists (~2027).","public":["compute_season_extremes","season_is_complete","upsert_observed_season","vintage_window"],"path":"backend/services/season_extremes.py"},{"id":"services.spray_coverage","label":"spray_coverage","package":"services","type":"module","category":"db","loc":521,"docstring":"","public":["assess_asset_spray_capability","assess_spray_readiness","compute_spray_coverage","detect_spray_blocks"],"path":"backend/services/spray_coverage.py"},{"id":"services.timesheet_rules","label":"timesheet_rules","package":"services","type":"module","category":"db","loc":76,"docstring":"","public":["create_entry","delete_entry","recalc_day","set_day_hours","update_entry"],"path":"backend/services/timesheet_rules.py"},{"id":"services.visitor_service","label":"visitor_service","package":"services","type":"module","category":"db","loc":332,"docstring":"","public":["VisitorService"],"path":"backend/services/visitor_service.py"},{"id":"sync_linz_parcels","label":"sync_linz_parcels","package":"app","type":"module","category":"db","loc":201,"docstring":"","public":["SimpleParcelsSync","main"],"path":"backend/sync_linz_parcels.py"},{"id":"utils","label":"utils","package":"utils","type":"module","category":null,"loc":0,"docstring":"","public":[],"path":"backend/utils/__init__.py"},{"id":"utils.aws_secrets","label":"aws_secrets","package":"utils","type":"module","category":"cloud","loc":59,"docstring":"","public":["get_rds_credentials"],"path":"backend/utils/aws_secrets.py"},{"id":"utils.el_scale","label":"el_scale","package":"utils","type":"module","category":null,"loc":387,"docstring":"EL Scale (Eichhorn-Lorenz) reference data for grape phenology observations\nBased on the modified E-L system for identifying major and intermediate grapevine growth stages","public":["get_el_stage_info","get_major_stages","get_next_stage","get_phases_for_dropdown","get_previous_stage","get_stages_by_phase","get_stages_for_dropdown","suggest_current_stages_by_month","validate_el_stage"],"path":"back <script>
(function () {
  "use strict";

  // Cytoscape parses its own style values and does NOT resolve CSS custom
  // properties — `var(--x)` is rejected as invalid and the property silently
  // falls back to its default. So graph colours are literals here, and the
  // :root CSS variables above style only the surrounding HTML chrome. Keep the
  // two in step by hand; they are intentionally duplicated.
  var C = {
    module: "#5b6b80", moduleEdge: "#7d8fa6", pkg: "#1b2230", pkgLine: "#3a4658",
    collapsed: "#243044", accent: "#58a6ff", edge: "#4a5768", edgeFaint: "#3d4757",
    flow: "#9aa7b8", bg: "#0f1218", text: "#c9d5e1"
  };

  var CATS = {
    db:     { hex: "#4f8ef7", label: "Database" },
    http:   { hex: "#f59e0b", label: "HTTP / external API" },
    cloud:  { hex: "#a78bfa", label: "Cloud / storage" },
    queue:  { hex: "#ec4899", label: "Queue / tasks" },
    fs:     { hex: "#34d399", label: "Filesystem" },
    config: { hex: "#fbbf24", label: "Config / secrets" }
  };

  function fail(msg) {
    document.getElementById("panel").innerHTML = '<div id="err"><b>Could not render.</b><br>' + msg + "</div>";
    document.getElementById("status").textContent = "error";
  }

  // Prefer graph.json so an edit to it shows up on reload; fall back to the copy
  // inlined at generate time, which is what happens over file:// where fetch is
  // blocked by CORS. Either way the page opens standalone.
  function loadGraph() {
    var inline = null;
    try {
      var raw = document.getElementById("inline-graph").textContent.trim();
      if (raw && raw.charAt(0) === "{") inline = JSON.parse(raw);
    } catch (e) { inline = null; }

    return fetch("graph.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) { return { graph: j, src: "graph.json" }; })
      .catch(function () {
        if (inline) return { graph: inline, src: "inlined snapshot" };
        throw new Error("graph.json could not be fetched and no inlined copy was found. " +
                        "Re-run <code>python docs/architecture/analyze.py</code>.");
      });
  }

  function build(graph) {
    var byId = {};
    graph.nodes.forEach(function (n) { byId[n.id] = n; });

    // Compound parents. Every node declares its package; the package node is
    // synthesised here so modules nest inside it and can be collapsed as a unit.
    var pkgs = {};
    graph.nodes.forEach(function (n) { if (n.package) pkgs[n.package] = true; });

    var els = [];
    Object.keys(pkgs).sort().forEach(function (p) {
      els.push({ data: { id: "pkg:" + p, label: p, isPkg: true,
                         ext: p.indexOf("external.") === 0 } });
    });
    graph.nodes.forEach(function (n) {
      els.push({ data: {
        id: n.id, label: n.label, parent: n.package ? "pkg:" + n.package : undefined,
        kind: n.type, cat: n.category || "", loc: n.loc || 0,
        doc: n.docstring || "", pub: n.public || [], path: n.path || ""
      }});
    });
    graph.edges.forEach(function (e, i) {
      if (!byId[e.source] || !byId[e.target]) return;
      els.push({ data: {
        id: "e" + i, source: e.source, target: e.target,
        kind: e.type, label: e.label || "",
        flavour: e.type === "import" ? (e.label || "runtime") : "flow"
      }});
    });
    return els;
  }

  function styles() {
    var s = [
      { selector: "node", css: {
          "label": "data(label)", "color": C.text, "font-size": "9px",
          "text-valign": "center", "text-halign": "center", "text-wrap": "wrap",
          "text-max-width": "80px", "min-zoomed-font-size": 7 }},
      { selector: 'node[kind="module"]', css: {
          "background-color": C.module, "shape": "round-rectangle",
          "border-width": 1, "border-color": C.moduleEdge,
          "width": "mapData(loc, 0, 800, 26, 78)", "height": "mapData(loc, 0, 800, 26, 78)" }},
      { selector: "node[?isPkg]", css: {
          "background-color": C.pkg, "background-opacity": .55,
          "border-width": 1.5, "border-color": C.pkgLine, "shape": "round-rectangle",
          "label": "data(label)", "font-size": "13px", "font-weight": "bold",
          "color": "#9fb0c4", "text-valign": "top", "text-halign": "center",
          "text-margin-y": -4, "padding": "16px", "min-zoomed-font-size": 0 }},
      { selector: "node[?ext]", css: { "border-style": "dashed", "background-opacity": .3 }},
      { selector: 'node[kind="external"]', css: {
          "shape": "diamond", "width": 30, "height": 30, "border-width": 2,
          "font-size": "9px", "text-valign": "bottom", "text-margin-y": 3 }},
      { selector: "node:selected", css: { "border-width": 3, "border-color": C.accent }},
      // A collapsed package has no visible children, so it needs an explicit
      // size — a compound node otherwise sizes itself to its contents and would
      // shrink to nothing.
      { selector: "node.collapsed", css: {
          "background-color": C.collapsed, "background-opacity": 1, "border-color": C.accent,
          "border-width": 2, "shape": "round-rectangle", "text-valign": "center",
          "font-size": "12px", "color": "#dbe6f2", "padding": "0px",
          "width": 104, "height": 46 }},

      { selector: "edge", css: {
          "curve-style": "bezier", "width": 1, "line-color": C.edge,
          "target-arrow-shape": "triangle", "arrow-scale": .6, "opacity": .5 }},
      { selector: 'edge[kind="import"]', css: {
          "line-color": C.edge, "target-arrow-color": C.edge, "width": 1, "opacity": .35 }},
      { selector: 'edge[flavour="deferred"]', css: { "line-style": "dashed", "opacity": .5 }},
      { selector: 'edge[flavour="type-only"]', css: {
          "line-style": "dotted", "opacity": .28, "line-color": C.edgeFaint }},
      { selector: 'edge[kind="dataflow"]', css: {
          "width": 2, "opacity": .75, "line-color": C.flow, "target-arrow-color": C.flow }},
      { selector: "edge.meta", css: {
          "line-color": C.accent, "target-arrow-color": C.accent,
          "width": "mapData(n, 1, 40, 1.5, 7)", "opacity": .75, "curve-style": "bezier" }},
      { selector: "edge.hover", css: {
          "label": "data(label)", "font-size": "10px", "color": "#fff", "opacity": 1,
          "width": 3, "text-background-color": C.bg, "text-background-opacity": .9,
          "text-background-padding": "3px", "z-index": 99 }},
      { selector: "edge.dim", css: { "opacity": .05 }},
      { selector: "node.dim", css: { "opacity": .12 }},
      { selector: "edge.focus", css: {
          "line-color": C.accent, "target-arrow-color": C.accent,
          "opacity": 1, "width": 2.5, "z-index": 90 }}
    ];
    // Colour every category once, for both the external node and its dataflow edges.
    Object.keys(CATS).forEach(function (c) {
      s.push({ selector: 'node[cat="' + c + '"][kind="external"]',
               css: { "background-color": CATS[c].hex, "border-color": CATS[c].hex,
                      "color": CATS[c].hex }});
      s.push({ selector: 'node[kind="module"][cat="' + c + '"]',
               css: { "border-color": CATS[c].hex, "border-width": 2 }});
      s.push({ selector: 'edge[kind="dataflow"][target^="ext:' + c + '"]',
               css: { "line-color": CATS[c].hex, "target-arrow-color": CATS[c].hex }});
      s.push({ selector: 'edge[kind="dataflow"][source^="ext:' + c + '"]',
               css: { "line-color": CATS[c].hex, "target-arrow-color": CATS[c].hex }});
    });
    return s;
  }

  function legend() {
    var h = ["<h4>Nodes</h4>",
      '<div class="row"><span class="sw" style="background:#5b6b80"></span>Internal module '
      + '<span class="muted">(size = LOC)</span></div>'];
    Object.keys(CATS).forEach(function (c) {
      h.push('<div class="row"><span class="sw" style="background:' + CATS[c].hex
             + ';transform:rotate(45deg)"></span>' + CATS[c].label + "</div>");
    });
    h.push("<hr><h4>Edges</h4>");
    h.push('<div class="row"><span class="ln" style="border-color:#4a5768"></span>Import</div>');
    h.push('<div class="row"><span class="ln" style="border-color:#4a5768;border-top-style:dashed">'
           + "</span>Deferred import <span class='muted'>(in-function)</span></div>");
    h.push('<div class="row"><span class="ln" style="border-color:#3d4757;border-top-style:dotted">'
           + "</span>Type-only <span class='muted'>(never runs)</span></div>");
    h.push('<div class="row"><span class="ln" style="border-color:#9aa7b8;border-top-width:3px">'
           + "</span>Dataflow <span class='muted'>(hover for label)</span></div>");
    h.push('<div class="row"><span class="ln" style="border-color:#58a6ff;border-top-width:3px">'
           + "</span>Collapsed <span class='muted'>(aggregate; width = count)</span></div>");
    document.getElementById("legend").innerHTML = h.join("");
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---- collapse -----------------------------------------------------------
  // Hiding a package's modules would also hide every edge touching them, so a
  // collapsed package would float unconnected. Instead each real edge crossing
  // a collapsed boundary is hidden and replaced by an aggregate "meta" edge
  // between the visible representatives, carrying the count it stands for. The
  // whole state is rebuilt from `collapsed` on every change, so toggles compose
  // in any order and cannot drift.
  function Collapser(cy) {
    var collapsed = {};

    function repOf(node) {
      var p = node.data("parent");
      return (p && collapsed[p]) ? p : node.id();
    }

    function apply() {
      // batch() wraps only the style/data churn. Structural add/remove is kept
      // outside it, which is what cytoscape's docs call for.
      cy.edges(".meta").remove();

      var agg = {};
      cy.batch(function () {
        cy.nodes("[?isPkg]").forEach(function (p) {
          var on = !!collapsed[p.id()];
          p.toggleClass("collapsed", on);
          p.children().style("display", on ? "none" : "element");
        });

        cy.edges().forEach(function (e) {
          var sN = e.source(), tN = e.target();
          var s = repOf(sN), t = repOf(tN);
          if (s === sN.id() && t === tN.id()) { e.style("display", "element"); return; }
          e.style("display", "none");
          if (s === t) return;            // wholly inside one collapsed package
          var k = s + "" + t + "" + e.data("kind");
          if (!agg[k]) agg[k] = { s: s, t: t, kind: e.data("kind"), n: 0 };
          agg[k].n++;
        });
      });

      var add = Object.keys(agg).map(function (k) {
        var a = agg[k];
        return { group: "edges", classes: "meta", data: {
          id: "meta:" + a.s + ">" + a.t + ":" + a.kind,
          source: a.s, target: a.t, kind: a.kind, n: a.n,
          label: a.n + " " + a.kind + (a.n > 1 ? "s" : "") }};
      });
      if (add.length) cy.add(add);
    }

    return {
      isCollapsed: function (id) { return !!collapsed[id]; },
      toggle: function (id) { collapsed[id] ? delete collapsed[id] : collapsed[id] = true; apply(); },
      // Opening a node's package is what makes it focusable after a search.
      reveal: function (id) {
        var n = cy.getElementById(id);
        if (n.nonempty() && n.data("parent") && collapsed[n.data("parent")]) {
          delete collapsed[n.data("parent")]; apply(); return true;
        }
        return false;
      },
      all: function (on) {
        collapsed = {};
        if (on) cy.nodes("[?isPkg]").forEach(function (p) { collapsed[p.id()] = true; });
        apply();
      },
      count: function () { return Object.keys(collapsed).length; }
    };
  }

  function render(cy, col) {
    var panel = document.getElementById("panel");

    function focus(id) {
      var n = cy.getElementById(id);
      if (!n || n.empty()) return;
      // A node inside a collapsed package is hidden; open it before centring.
      col.reveal(id);
      cy.elements().unselect();
      n.select();
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 320 });
      show(n);
    }

    function show(n) {
      if (n.data("isPkg")) {
        var kids = n.children();
        var loc = kids.reduce(function (a, k) { return a + (k.data("loc") || 0); }, 0);
        var isC = col.isCollapsed(n.id());
        panel.innerHTML = "<h2>" + esc(n.data("label")) + "</h2>"
          + '<div class="path">package</div>'
          + '<button class="wide" data-toggle="' + esc(n.id()) + '">'
          + (isC ? "Expand this package" : "Collapse this package") + "</button>"
          + '<div class="stat"><span>Modules</span><span>' + kids.length + "</span></div>"
          + '<div class="stat"><span>Lines</span><span>' + loc.toLocaleString() + "</span></div>"
          + "<h3>Members</h3>"
          + (kids.length ? kids.map(function (k) {
              return '<a class="link" data-go="' + esc(k.id()) + '">' + esc(k.data("label")) + "</a>";
            }).join("") : '<p class="empty">None.</p>');
        wire();
        return;
      }

      var inc = n.incomers("edge"), out = n.outgoers("edge");
      function list(edges, dir) {
        if (!edges.length) return '<p class="empty">None.</p>';
        return edges.map(function (e) {
          var other = dir === "in" ? e.source() : e.target();
          var kind = e.data("kind") === "dataflow"
            ? e.data("label") || "dataflow"
            : (e.data("label") || "import");
          return '<a class="link" data-go="' + esc(other.id()) + '">' + esc(other.id())
               + ' <span class="kind">— ' + esc(kind) + "</span></a>";
        }).join("");
      }

      var pub = n.data("pub") || [];
      panel.innerHTML = "<h2>" + esc(n.data("label")) + "</h2>"
        + '<div class="path">' + esc(n.data("path") || n.id()) + "</div>"
        + '<div class="stat"><span>Type</span><span>' + esc(n.data("kind"))
        + (n.data("cat") ? " · " + esc(n.data("cat")) : "") + "</span></div>"
        + '<div class="stat"><span>Package</span><span>' + esc(n.data("parent") ?
            String(n.data("parent")).replace("pkg:", "") : "—") + "</span></div>"
        + (n.data("kind") === "module"
            ? '<div class="stat"><span>Lines</span><span>' + n.data("loc") + "</span></div>" : "")
        + "<h3>Docstring</h3>"
        + (n.data("doc") ? '<div class="doc">' + esc(n.data("doc")) + "</div>"
                         : '<p class="empty">None.</p>')
        + (n.data("kind") === "module"
            ? "<h3>Public interface" + (pub.length ? " (" + pub.length + ")" : "") + "</h3>"
              + (pub.length ? pub.map(function (p) {
                  return '<span class="chip">' + esc(p) + "</span>"; }).join("")
                : '<p class="empty">Nothing public.</p>')
            : "")
        + "<h3>Depends on (" + out.length + ")</h3>" + list(out, "out")
        + "<h3>Used by (" + inc.length + ")</h3>" + list(inc, "in");
      wire();
    }

    function wire() {
      Array.prototype.forEach.call(panel.querySelectorAll("[data-go]"), function (a) {
        a.addEventListener("click", function () { focus(a.getAttribute("data-go")); });
      });
      Array.prototype.forEach.call(panel.querySelectorAll("[data-toggle]"), function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-toggle");
          col.toggle(id);
          show(cy.getElementById(id));
        });
      });
    }

    cy.on("tap", "node", function (e) { show(e.target); });
    cy.on("tap", function (e) {
      if (e.target === cy) {
        cy.elements().removeClass("dim focus");
        panel.innerHTML = '<p class="empty">Click any node to inspect it.</p>';
      }
    });
    cy.on("mouseover", "edge", function (e) { e.target.addClass("hover"); });
    cy.on("mouseout", "edge", function (e) { e.target.removeClass("hover"); });
    // Selecting a node dims everything unrelated, so its neighbourhood reads clearly.
    cy.on("select", "node", function (e) {
      var n = e.target, keep = n.closedNeighborhood().union(n.ancestors());
      cy.elements().addClass("dim");
      keep.removeClass("dim");
      n.connectedEdges().removeClass("dim").addClass("focus");
    });
    cy.on("unselect", "node", function () {
      cy.elements().removeClass("dim focus");
    });
    return { focus: focus };
  }

  function search(cy, focus) {
    var q = document.getElementById("q"), hits = document.getElementById("hits");
    function close() { hits.style.display = "none"; }
    q.addEventListener("input", function () {
      var v = q.value.trim().toLowerCase();
      if (!v) return close();
      var found = cy.nodes().filter(function (n) {
        return n.id().toLowerCase().indexOf(v) >= 0 ||
               String(n.data("label")).toLowerCase().indexOf(v) >= 0;
      });
      // Packages first — searching is mostly a way to jump to one.
      var arr = found.toArray().sort(function (a, b) {
        return (b.data("isPkg") ? 1 : 0) - (a.data("isPkg") ? 1 : 0);
      }).slice(0, 40);
      if (!arr.length) { hits.innerHTML = '<div class="sub">No match.</div>'; }
      else {
        hits.innerHTML = arr.map(function (n) {
          return '<div data-go="' + esc(n.id()) + '">' + esc(n.data("label"))
               + '<div class="sub">' + (n.data("isPkg") ? "package" : esc(n.id())) + "</div></div>";
        }).join("");
        Array.prototype.forEach.call(hits.querySelectorAll("[data-go]"), function (d) {
          d.addEventListener("click", function () {
            focus(d.getAttribute("data-go")); close(); q.value = "";
          });
        });
      }
      hits.style.display = "block";
    });
    q.addEventListener("keydown", function (e) { if (e.key === "Escape") { close(); q.blur(); } });
    document.addEventListener("click", function (e) {
      if (!hits.contains(e.target) && e.target !== q) close();
    });
  }

  function filters(cy) {
    document.getElementById("filter").addEventListener("change", function (e) {
      var v = e.target.value;
      cy.edges().style("display", "element");
      if (v === "import") cy.edges('[kind="dataflow"]').style("display", "none");
      else if (v === "dataflow") cy.edges('[kind="import"]').style("display", "none");
      else if (v === "runtime") cy.edges('[kind="import"][flavour!="runtime"]').style("display", "none");
    });
  }

  var LAYOUT = {
    name: "fcose", quality: "default", animate: false, randomize: true,
    nodeSeparation: 90, idealEdgeLength: 90, nodeRepulsion: 8000,
    gravity: 0.3, gravityCompound: 1.2, packComponents: true, tile: true,
    padding: 30, nestingFactor: 0.2, numIter: 2500
  };

  loadGraph().then(function (res) {
    var els;
    try { els = build(res.graph); }
    catch (e) { return fail("The graph could not be read: " + esc(e.message)); }

    // Both extensions must register BEFORE the instance is constructed.
    // fcose must register before the instance is constructed.
    var hasFcose = false;
    try {
      if (window.cytoscapeFcose) { cytoscape.use(window.cytoscapeFcose); hasFcose = true; }
    } catch (e) { hasFcose = false; }

    var cy;
    try {
      cy = cytoscape({
        container: document.getElementById("cy"),
        elements: els,
        style: styles(),
        // cose is bundled with cytoscape, so a CDN miss on fcose degrades the
        // layout rather than the page.
        layout: hasFcose ? LAYOUT : { name: "cose", animate: false, padding: 30 },
        wheelSensitivity: 0.25,
        maxZoom: 4, minZoom: 0.05
      });
    } catch (e) { return fail("Cytoscape failed to start: " + esc(e.message)); }

    var col = Collapser(cy);
    var relayout = function () {
      cy.layout(hasFcose ? LAYOUT : { name: "cose", animate: false, padding: 30 }).run();
    };

    document.getElementById("collapse").addEventListener("click", function () {
      col.all(true); relayout();
    });
    document.getElementById("expand").addEventListener("click", function () {
      col.all(false); relayout();
    });
    // Alt-click toggles one package. A plain click selects it, so the modifier
    // keeps inspecting and restructuring apart.
    cy.on("tap", "node", function (e) {
      var n = e.target;
      if (n.data("isPkg") && e.originalEvent && e.originalEvent.altKey) col.toggle(n.id());
    });

    document.getElementById("fit").addEventListener("click", function () { cy.fit(undefined, 40); });

    var api = render(cy, col);
    search(cy, api.focus);
    filters(cy);
    legend();

    var mods = cy.nodes('[kind="module"]').length, exts = cy.nodes('[kind="external"]').length;
    document.getElementById("status").textContent =
      mods + " modules · " + exts + " integrations · " + cy.edges().length + " edges · " + res.src
      + (hasFcose ? "" : " · fcose unavailable, using cose")
      + " · alt-click a package to collapse it";
  }).catch(function (e) { fail(e.message || String(e)); });
})();
</script>
</body>
</html>
