<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auxein Insights - Spray Track Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .iphone-frame {
      width: 393px;
      height: 852px;
      background: #000;
      border-radius: 55px;
      padding: 12px;
      box-shadow: 
        0 0 0 3px #1a1a1a,
        0 0 0 6px #333,
        0 50px 100px rgba(0,0,0,0.5),
        inset 0 0 2px rgba(255,255,255,0.1);
      position: relative;
    }
    
    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 37px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }
    
    .screen {
      width: 100%;
      height: 100%;
      background: #f8fafc;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }
    
    .status-bar {
      height: 54px;
      background: #5B6830;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      z-index: 50;
    }
    
    .status-bar .time {
      font-size: 15px;
      font-weight: 600;
    }
    
    .status-bar .icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    
    .status-bar .icons svg {
      width: 18px;
      height: 18px;
    }
    
    /* Full Map View */
    .map-container {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #5B6830;
      overflow: hidden;
    }
    
    .map-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 800px;
      object-fit: cover;
    }
    
    .map-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    
    /* Header overlay */
    .map-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.8) 70%, transparent 100%);
      padding: 16px;
      padding-top: 8px;
      z-index: 10;
    }
    
    .map-header .back-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      margin-bottom: 8px;
    }
    
    .map-header .back-row svg {
      width: 20px;
      height: 20px;
    }
    
    .map-header .back-row span {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .map-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 2px;
    }
    
    .map-header .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    
    /* Stats overlay */
    .stats-overlay {
      position: absolute;
      top: 100px;
      left: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      z-index: 10;
    }
    
    .stat-box {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    .stat-box .value {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
    }
    
    .stat-box .label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .stat-box.highlight {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    }
    
    .stat-box.highlight .value,
    .stat-box.highlight .label {
      color: white;
    }
    
    /* Live indicator */
    .live-indicator {
      position: absolute;
      top: 170px;
      right: 12px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }
    
    .live-indicator::before {
      content: '';
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    @keyframes pulse {
      0%, 100% { r: 8; }
      50% { r: 10; }
    }
    
    @keyframes pulse-ring {
      0% { r: 12; opacity: 0.6; }
      100% { r: 30; opacity: 0; }
    }
    
    .tractor-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .tractor-ring {
      animation: pulse-ring 2s ease-out infinite;
    }
    
    /* Bottom info panel */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-radius: 24px 24px 44px 44px;
      padding: 20px 16px;
      padding-bottom: 40px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      z-index: 20;
    }
    
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .panel-header .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .panel-header .icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .panel-header .icon svg {
      width: 22px;
      height: 22px;
    }
    
    .panel-header .text h3 {
      font-size: 16px;
      font-weight: 700;
      color: #1f2937;
    }
    
    .panel-header .text span {
      font-size: 12px;
      color: #6b7280;
    }
    
    .status-badge {
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-badge svg {
      width: 14px;
      height: 14px;
    }
    
    .task-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .detail-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
    }
    
    .detail-item .label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    
    .detail-item .value {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
    }
    
    .btn-row {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-stop {
      background: #fee2e2;
      color: #dc2626;
    }
    
    .btn-complete {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
    }
    
    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="screen">
      <!-- Status Bar -->
      <div class="status-bar">
        <span class="time">10:23</span>
        <div class="icons">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.46 3 3.34 4.78.29 7.67c-.18.18-.29.43-.29.71 0 .28.11.53.29.71l11 11c.39.39 1.02.39 1.41 0l11-11c.18-.18.29-.43.29-.71 0-.28-.11-.53-.29-.71C20.66 4.78 16.54 3 12 3z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>
      
      <!-- Map Container -->
      <div class="map-container">
        <!-- Mapbox Static Image - centered on Block 6 area -->
        <img class="map-image" 
             src="https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/172.8183,-43.0372,17.5,0/600x800@2x?access_token=pk.eyJ1IjoicGV0ZXRheWxvciIsImEiOiJjbTRtaHNxcHAwZDZ4MmxwbjZkeXNneTZnIn0.RJ9B3Q3-t_-gFrEkgshH9Q"
             alt="Satellite Map">
        
        <!-- SVG Overlay with blocks and track -->
        <svg class="map-overlay" viewBox="0 0 369 774" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="trackGradient" x1="0%" y1="0%" x2="100%" y2="0%">

  <script>
    // Map parameters matching the Mapbox static image
    const mapCenter = { lon: 172.81835, lat: -43.03705 };
    const zoom = 18.0;
    const imageWidth = 580;
    const imageHeight = 760;
    const tileSize = 552;
    
    // Convert lon/lat to pixel coordinates
    function lonLatToPixel(lon, lat) {
      const scale = Math.pow(2, zoom) * tileSize / (2 * Math.PI);
      
      // Center pixel
      const centerX = imageWidth / 2;
      const centerY = imageHeight / 2;
      
      // Convert center to Mercator
      const centerMercX = (mapCenter.lon + 180) / 360 * Math.pow(2, zoom) * tileSize;
      const centerMercY = (1 - Math.log(Math.tan(mapCenter.lat * Math.PI / 180) + 1 / Math.cos(mapCenter.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom) * tileSize;
      
      // Convert point to Mercator
      const pointMercX = (lon + 180) / 360 * Math.pow(2, zoom) * tileSize;
      const pointMercY = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom) * tileSize;
      
      // Pixel offset from center
      const pixelX = centerX + (pointMercX - centerMercX);
      const pixelY = centerY + (pointMercY - centerMercY);
      
      // Scale to SVG viewBox (369x774 maps to ~369x774 visible area)
      return {
        x: pixelX * (369 / imageWidth),
        y: pixelY * (774 / imageHeight)
      };
    }
    
    // Block coordinates (parsed from WKB)
    const blocks = [
      {
        name: "Block 6",
        active: true,
        coordinates: [
          [172.817660, -43.036899],
          [172.817975, -43.036845],
          [172.818531, -43.036861],
          [172.8191, -43.037606],
          [172.818238, -43.037622],
          [172.817660, -43.036899]
        ]
      }
    ];
    
    // GPX track coordinates
    const gpxTrack = [[172.81897061, -43.03761013], [172.8182359, -43.03761974], [172.81820872, -43.03762038], [172.81818768, -43.03760372], [172.81818242, -43.0375877], [172.81821574, -43.03757937], [172.81893642, -43.03757296], [172.81895658, -43.03757168], [172.8189785, -43.03756527], [172.81898464, -43.03754669], [172.81897236, -43.03753451], [172.81894168, -43.03753515], [172.81891099, -43.03753708], [172.81818715, -43.03754477], [172.81815121, -43.03754349], [172.8181328, -43.03753836], [172.8181214, -43.03752362], [172.8181328, -43.03751144], [172.81888679, -43.03750568], [172.81890959, -43.03750119], [172.81893502, -43.03749478], [172.81894641, -43.03747492], [172.81893502, -43.03746274], [172.81889732, -43.03746402], [172.8188754, -43.03746595], [172.81812491, -43.03747492], [172.81809685, -43.03747492], [172.81807493, -43.03746274], [172.81807405, -43.03744736], [172.81809597, -43.03743967], [172.81884997, -43.03742942], [172.81886926, -43.03742301], [172.81888504, -43.03741468], [172.81888767, -43.0373993], [172.81887277, -43.03739161], [172.81806178, -43.03740251], [172.81802408, -43.03740443], [172.81800392, -43.03739289], [172.81801093, -43.03737367], [172.81803986, -43.03736406], [172.81881666, -43.03735829], [172.8188392, -43.03735066], [172.81884208, -43.03733845], [172.81882346, -43.0373214], [172.81879523, -43.03732182], [172.81801719, -43.03733139], [172.81797225, -43.03733013], [172.81794401, -43.03732507], [172.8179348, -43.03730654], [172.81795496, -43.0372977], [172.81799184, -43.03729264], [172.81877813, -43.03728708], [172.8188127, -43.03728371], [172.81882941, -43.03727192], [172.81883401, -43.03725886], [172.81876315, -43.03725465], [172.81795286, -43.03725815], [172.8179258, -43.03725804], [172.81790275, -43.03725467], [172.81788892, -43.03724498], [172.8178872, -43.03723151], [172.81789929, -43.03722182], [172.81792177, -43.03722056], [172.81874258, -43.03721806], [172.81878752, -43.03721427], [172.81880019, -43.03720542], [172.81880192, -43.03719279], [172.8187927, -43.037181], [172.8187685, -43.03717721], [172.81788604, -43.03718482], [172.8178532, -43.03718187], [172.81783592, -43.03717303], [172.81783246, -43.03716039], [172.81784053, -43.03715071], [172.817863, -43.03714565], [172.81870422, -43.03714381], [172.81872957, -43.03714086], [172.81874686, -43.03713413], [172.81875492, -43.03712149], [172.81874974, -43.03710717], [172.8187192, -43.03710296], [172.81869961, -43.03711012], [172.81782986, -43.03711362], [172.8178006, -43.03711016], [172.81777985, -43.03710469], [172.81776775, -43.03709205], [172.81777409, -43.037079], [172.81780578, -43.03707731], [172.81866435, -43.03707467], [172.81869719, -43.03707046], [172.81871506, -43.03706246], [172.8187237, -43.03705193], [172.81870692, -43.03703456], [172.81867984, -43.03702572], [172.81865334, -43.03703667], [172.81776315, -43.03704298], [172.81772397, -43.03704383], [172.81770611, -43.03703372], [172.81770726, -43.03701982], [172.81772109, -43.03700887], [172.81774125, -43.0370034], [172.81863508, -43.0370033], [172.81866447, -43.03699615], [172.81868233, -43.03698899], [172.8186806, -43.03696035], [172.81864488, -43.03696245], [172.81861204, -43.03696456], [172.81769985, -43.03696786], [172.81767277, -43.03696996], [172.81763647, -43.03696575], [172.81762898, -43.03695522], [172.8176284, -43.03694385], [172.8176405, -43.03693459], [172.81766413, -43.03692911], [172.81768487, -43.03692869], [172.81859071, -43.03692955], [172.81861203, -43.0369266], [172.81863681, -43.03692491], [172.81864603, -43.03691481], [172.81864545, -43.03690554], [172.81862907, -43.03689397], [172.81857145, -43.03689271], [172.81787695, -43.03689197], [172.81783489, -43.03688692], [172.81781242, -43.03687134], [172.81781184, -43.03685365], [172.81781771, -43.03683326], [172.81784422, -43.03681852], [172.81787475, -43.03681936], [172.81791582, -43.03683828], [172.81793368, -43.03685175], [172.81798323, -43.03685807], [172.81855878, -43.03685384], [172.81858068, -43.03685257], [172.81858529, -43.03683868], [172.81857088, -43.03681973]];
    
    // Build SVG content
    const g = document.getElementById('blocks-and-track');
    let svgContent = '';
    
    // Draw blocks
    blocks.forEach(block => {
      const points = block.coordinates.map(([lon, lat]) => {
        const p = lonLatToPixel(lon, lat);
        return `${p.x},${p.y}`;
      }).join(' ');
      
      if (block.active) {
        svgContent += `<polygon points="${points}" fill="rgba(59, 130, 246, 0.35)" stroke="#3b82f6" stroke-width="3"/>`;
      } else {
        svgContent += `<polygon points="${points}" fill="rgba(34, 197, 94, 0.25)" stroke="#22c55e" stroke-width="2" stroke-opacity="0.8"/>`;
      }
    });
    
    // Draw GPX track
    const trackPoints = gpxTrack.map(([lon, lat]) => {
      const p = lonLatToPixel(lon, lat);
      return `${p.x},${p.y}`;
    }).join(' ');
    
    svgContent += `<polyline points="${trackPoints}" fill="none" stroke="url(#trackGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>`;
    
    // Draw tractor position (last point of track)
    const lastPoint = gpxTrack[gpxTrack.length - 1];
    const tractorPos = lonLatToPixel(lastPoint[0], lastPoint[1]);
    
    svgContent += `<circle class="tractor-ring" cx="${tractorPos.x}" cy="${tractorPos.y}" r="12" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>`;
    svgContent += `<circle class="tractor-dot" cx="${tractorPos.x}" cy="${tractorPos.y}" r="8" fill="#3b82f6" stroke="white" stroke-width="3"/>`;
    
    g.innerHTML = svgContent;
  </script>
</body>
