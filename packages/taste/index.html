<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Media-scoped so the status bar is right on first paint, before JS runs.
         theme.ts overwrites BOTH when an explicit theme is chosen. Values must
         match --bg for each theme in index.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17120F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Taste" />
    <title>Auxein Taste</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
