name: Daily Aggregation (rollup only)

# Why this exists separately from daily-processing.yml.
#
# The full pipeline (phenology, disease pressure, zone rollups) is genuinely a
# once-a-day job and runs at 17:00/18:00 NZ. But it processes YESTERDAY, so the
# daily table trails real time by up to two days, and until 2026-08-19 it passed a
# single `--date` with no catch-up: a run that was skipped, failed, or dropped by
# the scheduler left that day permanently un-aggregated. 2026-08-12 lost a full day
# of SYNOP that way — 8,086 raw rows, 48 stations, no daily row — while the
# workflow reported success.
#
# `daily_aggregation` is idempotent (upsert on station_id+date) and set-based, so
# re-running a short window is cheap. Running it on its own every six hours keeps
# weather_data_daily close to the raw record without dragging the heavy downstream
# steps along, and the overlapping windows mean a missed run heals itself.

# MANUAL ONLY SINCE 2026-08-31. The six-hourly schedule now lives in EventBridge
# Scheduler as `auxein-pipeline-aggregate`, running JOB=aggregate on the
# `auxein-pipeline` Fargate task definition. See deploy/surfaces/aggregate.sh.
#
# DO NOT RESTORE THE `schedule:` BLOCK without first deleting that schedule.
# Every stage here is an idempotent upsert, so two schedulers would produce no
# visible corruption and no failed run — only doubled work nobody would spot.
#
# This one never needed the daylight-saving twin the 18:00 and 03:00 jobs did:
# `35 */6 * * *` is a cadence, not a wall-clock time. It moved for the other
# reason. Its four runs on 2026-08-30 started at 05:43, 12:10, 16:56 and 21:27
# UTC against a `:35` cron — up to 55 minutes of drift, on the job whose entire
# purpose is to read a SETTLED six-hour window rather than race the writers.
# The EventBridge replacement fires at 01:20 / 07:20 / 13:20 / 19:20 NZ, placed
# to clear the 03:00 surfaces fit and the 18:00 pipeline on both sides.

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days before yesterday to re-aggregate (default 3)'
        required: false
        default: '3'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 pydantic pydantic-settings
          cd backend && pip install -r requirements.txt

      - name: Run daily aggregation only
        env:
          ENV: staging
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: 5432
          RDS_DATABASE: auxein_db
        run: |
          cd backend
          python scripts/run_daily_processing.py \
            --lookback-days "${{ github.event.inputs.lookback_days || '3' }}" \
            --skip-hourly --skip-zone --skip-phenology --skip-disease

      - name: Sanity-check the result
        # Fails the run if any source shows the degenerate signature. A rollup that
        # completed is not the same as a rollup that produced usable statistics.
        continue-on-error: true
        env:
          ENV: staging
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: 5432
          RDS_DATABASE: auxein_db
        run: |
          cd backend
          python scripts/check_daily_climate.py --since "$(date -u -d '14 days ago' +%Y-%m-%d)"

      - name: Disease pressure at every Pro site
        # HERE RATHER THAN IN THE 18:00 JOB, and it is not arbitrary.
        #
        # This path reads `weather_data` hourly, not `weather_data_daily`, so it
        # depends on nothing this workflow's rollup produces and everything on
        # the hourly ingest. Six-hourly is the cadence that matches its input;
        # the 18:00 pipeline would make a grower wait a day for a wetness event.
        #
        # LAST, so that a failure here cannot skip the rollup's own sanity
        # check. That check is `continue-on-error` and never fails the build, but
        # a step ordered after a hard failure does not run at all — putting the
        # disease step earlier would have traded the rollup's only alarm for it.
        #
        # It also needs no daylight-saving guard, which the 18:00 and 03:00 jobs
        # both do: `35 */6 * * *` is a CADENCE rather than a wall-clock time, so
        # there is no NZ hour to hit and no twin to discard.
        #
        # WHY THE WINDOW ENDS YESTERDAY, on a job that runs four times a day.
        # The models score whole LOCAL days. A partial today would be scored as
        # if it were complete, and since every model is driven through a count of
        # wet hours, a day that is only half over reads as a dry one — the same
        # defect that a UTC-aligned window produced at the first day of a
        # backfill. Freshness within the day is not worth a systematic
        # under-call. The three-day window is the ingest's own revision tail, and
        # the upsert is idempotent, so the overlap repairs any missed run.
        env:
          ENV: staging
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: 5432
          RDS_DATABASE: auxein_db
        run: |
          cd backend
          python scripts/populate_site_disease.py \
            --days 3 \
            --apply \
            --require-rows
