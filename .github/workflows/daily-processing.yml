name: Daily Climate Processing

on:
  schedule:
    # GitHub cron is UTC only and NZ observes daylight saving, so 18:00 NZ needs
    # two entries. Exactly one of each pair lands on the intended NZ hour; the
    # other is dropped by the DST guard in "Resolve schedule" below.
    #
    # WITHOUT THAT GUARD BOTH FIRE, ALL YEAR. The whole pipeline — aggregation,
    # QC, hourly, zone rollup, phenology, disease — ran twice a day, every day,
    # and one of the two was always an hour off the intended 18:00. Nothing
    # corrupted, because every stage is an idempotent upsert, which is exactly
    # why it went unnoticed: the only symptoms were doubled work and a run log
    # that could not be read against a schedule.
    - cron: '0 5 * * *'   # 18:00 NZDT (UTC+13, summer)
    - cron: '0 6 * * *'   # 18:00 NZST (UTC+12, winter)

  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD)'
        required: false

jobs:
  daily-processing:
    runs-on: ubuntu-latest
    steps:
      # Runs BEFORE checkout and the dependency install, so the discarded half
      # of each cron pair costs seconds rather than a full environment build.
      - name: Resolve schedule
        id: sched
        run: |
          set -euo pipefail
          SCHED="${{ github.event.schedule }}"

          # An empty schedule means workflow_dispatch — a person asked for it, at
          # whatever hour they asked, and it must never be skipped.
          if [ -z "$SCHED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual run, no schedule to resolve" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # THE HOUR THAT DECIDES IS THE ONE THE CRON WAS SCHEDULED FOR, NEVER
          # THE ONE THE RUNNER HAPPENED TO START IN.
          #
          # The first version of this guard read `date +%H` at execution. That
          # assumes GitHub starts a scheduled job in the hour it was asked for,
          # and it does not: lateness of 24-106 minutes is routine (measured, see
          # synop-live.yml) and on 2026-08-28 a '0 15' cron was observed starting
          # at 00:00 UTC — NINE HOURS late. Past the hour boundary BOTH halves of
          # the pair skip, the pipeline goes dark, and the notice it prints is
          # word-for-word the one a correct daylight-saving skip prints. That is
          # how zone rollup, disease and phenology silently stopped for three
          # days from 2026-08-25.
          #
          # Deriving the NZ hour from the cron's own UTC hour is immune to all of
          # it, because the mapping only moves with daylight saving and not with
          # when the runner woke up.
          CRON_UTC_HOUR=$(echo "$SCHED" | awk '{print $2}')
          NZ_HOUR=$(TZ=Pacific/Auckland \
                    date -d "$(date -u +%F) ${CRON_UTC_HOUR}:00 UTC" +%H)

          if [ "$NZ_HOUR" != "18" ]; then
            echo "::notice::SKIPPED - cron '$SCHED' is ${NZ_HOUR}:00 NZ today, "\
                 "not the intended 18:00. This is its daylight-saving twin."
            echo "**SKIPPED** - cron \`$SCHED\` is ${NZ_HOUR}:00 NZ today, not 18:00." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RUNNING - cron '$SCHED' is 18:00 NZ today"
            echo "**RAN** - cron \`$SCHED\` is 18:00 NZ today." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.sched.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.sched.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.sched.outputs.skip != 'true'
        run: |
          pip install boto3 pydantic pydantic-settings
          cd backend && pip install -r requirements.txt

      - name: Run daily processing
        if: steps.sched.outputs.skip != 'true'
        env:
          ENV: staging
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HARVEST_API_KEY: ${{ secrets.HARVEST_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: 5432
          RDS_DATABASE: auxein_db
        run: |
          cd backend
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/run_daily_processing.py $DATE_ARG