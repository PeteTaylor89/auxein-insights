name: SYNOP Live Ingestion

# Provisional live tier (B2 v1) — pulls near-real-time SYNOP via Ogimet HTTP and
# upserts PROVISIONAL (rank 1) into timeseries_observations. No persistent host
# needed (Ogimet is plain HTTP), so this scheduled cron IS the "always-on" feed;
# Unidata LDM is the deferred v2. The B3/B4 NOAA pass promotes these rows to
# authoritative in place. Each run re-pulls the last 48h (sliding window) so it
# is idempotent and catches late / COR-corrected reports.

on:
  # THE SCHEDULE IS OFF (2026-08-25). SYNOP moved to the EC2 ingest box's cron,
  # in `ingestion/run_all.sh`, alongside every other source.
  #
  # It was the last job on GitHub's scheduler and the only unreliable one.
  # Measured over 2026-08-23..24 its runs started 24, 30, 32, 36, 43, 48, 50,
  # 52, 53, 61, 68 and 106 minutes after the cron time — while every source on
  # the box starts at :05:07 to the second. On 2026-08-25 the 00:10Z run had
  # still not landed by 01:24Z, the newest reading was 4h24m old against the
  # home page's 4-hour currency window, and the warmest and coldest tiles
  # vanished from the hero.
  #
  # A 3-hourly cron with 24-106 minutes of jitter cannot keep a 4-hour window
  # fed: the worst case is 4h56m of staleness, so the strip was emptying most
  # nights and nobody had noticed. The box polls hourly and on time.
  #
  # `workflow_dispatch` STAYS. This is still how a manual catch-up, a
  # single-station probe, a dry run and the NOAA reconcile pass are run — and
  # it is what to use right now if the feed is behind.
  #
  # The commented block is kept as a record of what the cadence WAS, not as
  # something to uncomment. SYNOP is ingested hourly by `run_all.sh` on the box;
  # restoring this would double-pull 48 stations against an idempotent upsert,
  # which corrupts nothing and is therefore the kind of thing that runs for
  # months unnoticed.
  #
  # schedule:
  #   - cron: '10 */3 * * *'

  workflow_dispatch:
    inputs:
      station:
        description: 'Single station_code (e.g. SYNOP_93110); blank = whole fleet'
        required: false
      reconcile:
        description: 'Run NOAA authoritative promotion pass instead of the live pull'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Fetch + decode but do not write'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  synop-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install boto3==1.34.0 pydantic==2.5.0 pydantic-settings==2.1.0
          cd ingestion
          pip install -r requirements.txt

      - name: Run SYNOP live ingestion
        env:
          ENV: staging
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HARVEST_API_KEY: ${{ secrets.HARVEST_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: 5432
          RDS_DATABASE: auxein_db
        run: |
          cd ingestion
          ARGS="--source synop"
          if [ -n "${{ github.event.inputs.station }}" ]; then
            ARGS="$ARGS --station ${{ github.event.inputs.station }}"
          fi
          if [ "${{ github.event.inputs.reconcile }}" = "true" ]; then
            ARGS="$ARGS --reconcile"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python run_ingestion.py $ARGS
